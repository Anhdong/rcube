[package]
name = "rcube"
version = "0.2.1"
edition = "2021"
description = "A vim-style 3x3 speedcubing timer for the terminal"
license = "MIT"

[dependencies]
ratatui = "0.29"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
